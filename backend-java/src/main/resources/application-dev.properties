# ---------------------------------------------------------------------------
# Local development profile (Phase 10.4.1 finding 5).
#
# The shipped default allow-list is empty (fail-closed) so a production
# deployment can never implicitly trust a browser origin. The localhost origins
# the Vite dev server needs therefore live here, and only here:
#
#   http://localhost:5173  - the React 19 + Vite dev server (npm run dev)
#   http://localhost:3000  - the retired Node/Express origin, kept so a
#                            developer can still point a browser at a
#                            same-machine third-party client during debugging.
#                            It is NOT a production trust relationship.
#
# Activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   or  export SPRING_PROFILES_ACTIVE=dev
#
# CARBONFLOW_CORS_ALLOWED_ORIGINS still wins when set, so a developer can point
# the local build at a deployed frontend without editing this file.
# ---------------------------------------------------------------------------

carbonflow.cors.allowed-origins=${CARBONFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
