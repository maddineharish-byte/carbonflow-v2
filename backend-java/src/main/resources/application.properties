server.port=8080
spring.application.name=carbonflow-backend

# ---------------------------------------------------------------------------
# Evidence vault (Phase 5) — multipart limits: 25 MB per file (storage
# re-validates byte-for-byte), 28 MB request ceiling so multipart framing never
# trips the file limit. The values are carried over unchanged from the retired
# reference backend so audit evidence already accepted under the old limits is
# still accepted here. Oversized uploads surface as MaxUploadSizeExceededException
# and map to the envelope as 400 UPLOAD_FAILED (see ApiExceptionHandler).
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=28MB
# Local filesystem vault (gitignored "vault_storage/"); override for deploys.
# No cloud/object-storage dependency is introduced — smallest architecture
# compatible with the existing Node LocalStorageAdapter design.
carbonflow.evidence.vault-dir=${CARBONFLOW_EVIDENCE_VAULT_DIR:vault_storage}

# ---------------------------------------------------------------------------
# Authentication — fail-closed (no secret is ever committed to the repository).
# JwtTokenProvider refuses to start when the value is missing, blank, or shorter
# than 256 bits (required for HS256).
# ---------------------------------------------------------------------------
carbonflow.jwt.secret=${CARBONFLOW_JWT_SECRET:}
# Access-token lifetime aligned with the Node reference backend (15 minutes).
carbonflow.jwt.expiration-ms=900000
# Refresh-token HMAC key: the opaque 64-hex refresh tokens are stored only as
# keyed hashes. AuthService refuses to start when this is missing/short —
# same fail-closed rule as the JWT secret.
carbonflow.auth.refresh-secret=${CARBONFLOW_REFRESH_TOKEN_SECRET:}

# ---------------------------------------------------------------------------
# Development seed identities (organizations/users/memberships) — OFF by
# default so no demo credential is ever written unless explicitly opted in
# (contrast Phase 1 finding R11: the Node backend seeds unconditionally in
# production). Local development: CARBONFLOW_SEED_DEMO_DATA=true; the
# integration-test "dbtest" profile enables it explicitly.
# ---------------------------------------------------------------------------
carbonflow.seed.demo-data=${CARBONFLOW_SEED_DEMO_DATA:false}

# ---------------------------------------------------------------------------
# CORS — explicit origin allow-list, owned by the deployment environment
# (Phase 10.4.1 finding 5).
#
# There is deliberately NO default: a deployment that never sets
# CARBONFLOW_CORS_ALLOWED_ORIGINS trusts no browser origin, and the API then
# emits no Access-Control-Allow-Origin header at all (fail-closed). Same-origin
# traffic, the React production bundle served from the same host, and
# server-to-server calls are unaffected — only cross-origin browser calls are
# refused until the operator names the real frontend origin(s).
#
# Local React development uses the "dev" profile, which carries the localhost
# origins (application-dev.properties). http://localhost:3000 was the retired
# Node/Express origin and is no longer trusted by the shipped default.
#
# Never "*" with credentials: SecurityConfig refuses to start on it.
# Comma-separated, exact origins (scheme + host + optional port), no trailing
# slash, no wildcards. Multiple deployments are supported by listing several.
# ---------------------------------------------------------------------------
carbonflow.cors.allowed-origins=${CARBONFLOW_CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------------
# Auto-configuration exclusions
# PersistenceExceptionTranslationAutoConfiguration only matters for ORM-based
# repositories; with plain JDBC (ADR-009), JdbcTemplate performs SQL-exception
# translation itself. Excluding it also prevents @Repository beans from being
# CGLIB-proxied without running constructors, which would leave their fields
# null for direct field reads.
# NOTE: a profile-specific spring.autoconfigure.exclude REPLACES this list
# (values do not merge) — application-dbtest.properties therefore declares no
# exclusions at all, which leaves this list intact while DataSource/Flyway
# auto-configuration stays enabled for the embedded test server.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.dao.PersistenceExceptionTranslationAutoConfiguration

# ---------------------------------------------------------------------------
# PostgreSQL — ADR-009: plain JDBC (spring-boot-starter-jdbc), no ORM.
# PostgreSQL stays the single source of truth; all queries are explicit SQL.
# ---------------------------------------------------------------------------
# stringtype=unspecified: PgJDBC must bind String parameters as "unknown" so
# PostgreSQL can infer uuid/timestamptz for the target columns — without it,
# every INSERT/UPDATE passing a String id into a uuid column fails with
# 'column "id" is of type uuid but expression is of type character varying'.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?stringtype=unspecified
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ---------------------------------------------------------------------------
# PostgreSQL transport security (F-01, Phase 10.6.1).
#
# DB_SSLMODE is passed to the driver as a connection property rather than being
# concatenated into the JDBC URL, so a value can never be half-applied. PgJDBC
# reads it from the connection Properties exactly as it would from the URL.
#
# Accepted values are exactly the PgJDBC sslmode modes; DataSourceTls rejects
# anything else at startup rather than letting the driver fall back silently:
#
#   disable     plaintext, no encryption. Development only.
#   allow       plaintext first, upgrade to TLS if the server offers it.
#   prefer      try TLS, fall back to plaintext. NOT SAFE for production.
#   require     TLS mandatory, but the server certificate is NOT verified.
#               Encrypts the transport; does NOT prove server identity.
#   verify-ca   TLS mandatory + certificate verified against a trusted CA.
#   verify-full TLS mandatory + certificate AND hostname verified.
#
# The default is the PgJDBC default (prefer) so existing local development is
# unaffected. Production MUST set DB_SSLMODE explicitly; `prefer` permits a
# silent downgrade to plaintext. verify-ca / verify-full use the JVM trust store
# (-Djavax.net.ssl.trustStore=...), so no extra variable is required.
# ---------------------------------------------------------------------------
carbonflow.db.ssl-mode=${DB_SSLMODE:prefer}
spring.datasource.hikari.data-source-properties.sslmode=${carbonflow.db.ssl-mode}

# ---------------------------------------------------------------------------
# Flyway — schema migrations live in the repository-root db/migration folder
# (V1..Vn, Flyway naming convention) and are packaged onto the classpath by
# pom.xml, so the Java backend and the deployment tooling apply the same files.
#
#   * empty database              -> V1..Vn are applied in order
#   * database already migrated   -> baselines at 6 (V1..V6 were applied
#     manually through V6, no flyway history) and applies only newer migrations
#     NOTE: a partially migrated database must be baselined manually instead.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6
spring.flyway.validate-on-migrate=true
