# ---------------------------------------------------------------------------
# Test profile for integration tests that need a real PostgreSQL ("dbtest").
#
# The JDBC url/username/password are injected at context startup by
# PostgresBackedIntegrationTest via @DynamicPropertySource (zonky embedded
# PostgreSQL) — they are intentionally absent here.
#
# NOTE: profile-specific spring.autoconfigure.exclude would REPLACE the main
# list, so no exclusions are declared: DataSource and Flyway auto-configuration
# stay ENABLED and migrations V1..Vn run against the embedded server on every
# test context startup.
# ---------------------------------------------------------------------------

carbonflow.jwt.secret=dbtest-only-jwt-signing-secret-with-32-bytes-ok
carbonflow.auth.refresh-secret=dbtest-only-refresh-hmac-secret-32-bytes-ok
carbonflow.seed.demo-data=true
