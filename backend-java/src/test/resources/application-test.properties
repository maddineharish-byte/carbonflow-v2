# Test profile: loads the full Spring Security chain WITHOUT a database.
# The application context is exercised in-memory (repository/DataStore) so the
# security, envelope and RBAC behaviour can be verified without PostgreSQL.
# NOTE: this list REPLACES spring.autoconfigure.exclude from the main\n# application.properties (profile values do not merge for list properties),\n# so it repeats the persistence-exception exclusion plus the DataSource/Flyway\n# exclusions that keep the test context database-free.\nspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.dao.PersistenceExceptionTranslationAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.flyway.enabled=false

# Fail-closed configuration requires a secret even in tests; this value is
# test-only and grants no access to any environment.
carbonflow.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
carbonflow.jwt.expiration-ms=900000
carbonflow.cors.allowed-origins=http://localhost:3000
